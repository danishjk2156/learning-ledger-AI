[project]
name = "learning-ledger"
version = "0.1.0"
description = "A system that remembers what you learn from papers and tells you when it becomes wrong."
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "chromadb",
    "pypdf",
    "typesafe-sdk",
    "openharness-ai",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
ledger = "src.main:main"
ledger-ui = "src.web:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

